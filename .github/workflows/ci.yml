# CI: linters (strict oxlint + clippy -D warnings), typecheck, the
# unit/instrumenter tests and the Playwright e2e suite against the real
# stack (Rust server + Vite). Patterns borrowed from GitButler (one job
# per concern + shared rust-cache) and Clash Verge Rev (toolchains).
name: CI

on:
  push:
    branches: [main, rust-backend]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  ZLS_TARBALL: https://builds.zigtools.org/zls-x86_64-linux-0.16.0.tar.xz
  ZLS_SHA256: ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: atomis
          workspaces: |
            apps/server-rs
      - run: pnpm install --frozen-lockfile
      - name: Build protocol types
        run: pnpm --filter @atomis/protocol build
      - name: Lint (oxlint + clippy)
        run: pnpm lint
      - name: Typecheck (packages + e2e)
        run: pnpm typecheck
      - name: Cross-check the server for macOS (release builds on Darwin)
        run: cargo check --manifest-path apps/server-rs/Cargo.toml --target aarch64-apple-darwin

  test:
    name: Unit + instrumenter tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: atomis
          workspaces: |
            apps/server-rs
            rust/instrumenter
      - run: pnpm install --frozen-lockfile
      - name: Tests (zig, instrumenters, cargo, vitest)
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: atomis
          workspaces: |
            apps/server-rs
            rust/instrumenter
      - name: Install clangd (the cpp spec asserts LSP hover)
        run: |
          sudo apt-get update
          sudo apt-get install -y clangd
      - name: Install ZLS ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "$ZLS_TARBALL" -o /tmp/zls.tar.xz
          echo "$ZLS_SHA256  /tmp/zls.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf /tmp/zls.tar.xz -C "$HOME/.local/bin" zls
          chmod +x "$HOME/.local/bin/zls"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Prebuild stack (instrumenters + server)
        run: |
          pnpm zig:build
          pnpm rust:build
          pnpm go:build
          pnpm --filter @atomis/protocol build
          cargo build --manifest-path apps/server-rs/Cargo.toml
      # Sessions share one Zig cache (see sandbox::toolchain_cache_root), so
      # only the first compile of the standard library is slow. Paying for it
      # here keeps that cost out of the first test's timeout.
      - name: Warm the shared Zig cache
        run: |
          mkdir -p "$RUNNER_TEMP/warm"
          echo 'pub fn main() void {}' > "$RUNNER_TEMP/warm/main.zig"
          export ZIG_GLOBAL_CACHE_DIR="$HOME/.cache/atomis/toolchains/zig"
          export ZIG_LOCAL_CACHE_DIR="$RUNNER_TEMP/warm/local"
          zig build-exe "$RUNNER_TEMP/warm/main.zig" -femit-bin="$RUNNER_TEMP/warm/a"
          zig build-exe "$RUNNER_TEMP/warm/main.zig" -lc -femit-bin="$RUNNER_TEMP/warm/b"
      - name: Doctor (informational)
        run: pnpm run doctor || true
      - name: E2E
        run: pnpm test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
