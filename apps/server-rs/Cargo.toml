[package]
name = "atomis-server"
version = "0.2.0"
license = "MIT"
repository = "https://github.com/Osmait/atomis"
edition = "2021"
description = "Atomis orchestrator rewrite: axum/tokio, same WS protocol as apps/server"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "net", "io-util", "io-std", "sync", "time", "fs"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
rand = "0.8"
regex = "1"
futures-util = "0.3"

# Landlock is a Linux kernel interface and its crate does not build
# anywhere else, so it is only a dependency there. Every call site is
# already behind cfg(target_os = "linux"); on other systems the sandbox
# reports itself unsupported and runs stay unconfined.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
lto = true
strip = true

[dev-dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
